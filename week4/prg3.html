<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>feedback form</title>
    <link rel="stylesheet" href="style3.css">
</head>
<body>
    <h2>feedback form</h2>
    <form class="feedback-form">

        <label>student name</label>
        <input type="text" name="student_name"><br><br>
        <label> email id </label>
        <input type="email" id="email_id"><br><br>
        <label> feedback:</label>
        <textarea name="feedback" rows="4" cols="40"></textarea><br><br>
        <label> rating</label><br><br>
        <div class="radio-group">
        <input type = "radio" name="feedback" value="excellent">excellent<br><br>
        <input type = "radio" name="feedback" value="good">good<br><br>
        <input type = "radio" name="feedback" value="bad">bads<br><br>
        </div>
        <button  type = "submit">submit</button>
        </form>
        


</body>
</html>
