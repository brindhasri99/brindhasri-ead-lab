<!DOCTYPE html>
<html>
<head>
    <title>Time Table</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<div class="container mt-5">
    <h2 class="text-center mb-4">Class Time Table</h2>

    <table class="table table-bordered text-center">
        <thead class="table-dark">
            <tr>
                <th>Day</th>
                <th>9-10</th>
                <th>10-11</th>
                <th>11-12</th>
                <th>12-1</th>
                <th>1-2</th>
            </tr>
        </thead>

        <tbody>
            <tr>
                <td>Monday</td>
                <td>DBMS</td>
                <td>OS</td>
                <td class="table-warning">Break</td>
                <td>Math</td>
                <td>Python</td>
            </tr>

            <tr>
                <td>Tuesday</td>
                <td>Java</td>
                <td>DBMS</td>
                <td class="table-warning">Break</td>
                <td>OS</td>
                <td>Math</td>
            </tr>

            <tr>
                <td>Wednesday</td>
                <td>Python</td>
                <td>Java</td>
                <td class="table-warning">Lunch</td>
                <td>DBMS</td>
                <td>OS</td>
            </tr>
        </tbody>
    </table>

</div>

</body>
</html>
